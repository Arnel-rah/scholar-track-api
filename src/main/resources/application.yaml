spring:
  application:
    name: graduate-diplomate-api
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

aws:
  eventBridge:
    bus: default
  s3:
    bucket: default-bucket
jwt:
  secret: ${JWT_SECRET:7f8e9a2b4c6d8f0e1a3b5c7d9e0f2a4b6c8e0a2b4c6d8f0e1a3b5c7d9e0f2a4b}
  expiration-days: ${JWT_EXPIRATION_DAYS:7}
